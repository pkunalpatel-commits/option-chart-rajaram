<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Option Chain + OI Profile</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/4.1.3/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0e1116;--fg:#d7dde6;--mut:#7d8795;--card:#171b22;--acc:#f5a623;--ln:#2a313c;--g:#26a69a;--r:#ef5350}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:13px system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
body{display:flex;flex-direction:column}
.bar{display:flex;gap:6px;padding:8px;flex-wrap:wrap;align-items:center;background:var(--card)}
select,button{background:var(--bg);color:var(--fg);border:1px solid var(--ln);border-radius:6px;padding:7px;font-size:13px}
#dot{width:9px;height:9px;border-radius:50%;background:#555;margin-left:auto}#dot.on{background:var(--g);animation:b 1.2s infinite}
@keyframes b{50%{opacity:.3}}
#spot{font-weight:700;color:var(--acc)}
#tw{flex:1;overflow:auto}
table{border-collapse:collapse;width:100%;min-width:640px;text-align:right}
th{position:sticky;top:0;background:var(--card);color:var(--mut);font-weight:600;padding:6px;font-size:11px;z-index:2}
td{padding:5px 6px;border-bottom:1px solid #1a1f27;position:relative}
td.k{text-align:center;font-weight:700;background:var(--card)}tr.atm td.k{background:var(--acc);color:#000}
td.t{cursor:pointer;color:#8ab4ff;text-decoration:underline dotted}
.bo{position:absolute;top:2px;bottom:2px;opacity:.28}.ce .bo{right:0;background:var(--g)}.pe .bo{left:0;background:var(--r)}
td span{position:relative}.up{color:var(--g)}.dn{color:var(--r)}
tr.ic td.ce,tr.ip td.pe{background:#161c24}
.st{padding:5px 10px;color:var(--mut);font-size:12px;background:var(--card)}.st b{color:var(--acc)}
#cv{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:5;padding-top:env(safe-area-inset-top)}
#wrap{position:relative;flex:1;min-height:0}#chart,#ov{position:absolute;inset:0}#ov{pointer-events:none}
</style></head><body>
<div class="bar">
 <select id="und"><option value="13|IDX_I|NSE_FNO">NIFTY</option><option value="25|IDX_I|NSE_FNO">BANKNIFTY</option><option value="27|IDX_I|NSE_FNO">FINNIFTY</option><option value="442|IDX_I|NSE_FNO">MIDCPNIFTY</option><option value="51|IDX_I|BSE_FNO">SENSEX</option></select>
 <select id="exp"></select>
 <select id="win"><option value="8">±8 strikes</option><option value="15" selected>±15</option><option value="999">All</option></select>
 <span id="spot"></span><span id="dot"></span>
</div>
<div id="tw"><table><thead><tr><th>OI</th><th>ΔOI</th><th>IV</th><th>LTP</th><th>STRIKE</th><th>LTP</th><th>IV</th><th>ΔOI</th><th>OI</th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="st" id="st">Loading…</div>

<div id="cv">
 <div class="bar"><button onclick="closeChart()">← Chain</button><b id="ctitle"></b>
  <select id="intv"><option>1</option><option selected>5</option><option>15</option></select>
  <select id="mode"><option value="built">Built OI</option><option value="raw">Raw OI</option></select>
  <select id="tick"><option>1</option><option selected>2</option><option>5</option></select></div>
 <div id="wrap"><div id="chart"></div><canvas id="ov"></canvas></div>
 <div class="st" id="st2"></div>
</div>
<script>
// ===== SET THIS after deploying worker.js (leave as is for DEMO mode) =====
const PROXY='https://YOUR-WORKER.YOURNAME.workers.dev';
// ==========================================================================
const DEMO=PROXY.includes('YOUR-WORKER'),$=id=>document.getElementById(id);
const fmt=n=>n==null?'-':Math.abs(n)>=1e5?(n/1e5).toFixed(2)+'L':n.toLocaleString('en-IN');
const post=async(p,b)=>{const r=await fetch(PROXY+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
 if(!r.ok)throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,90));return r.json()};
const und=()=>{const [id,seg,fno]=$('und').value.split('|');return{id:+id,seg,fno,name:$('und').selectedOptions[0].text}};

/* ---------- demo data ---------- */
function demoExpiries(){const a=[],d=new Date();d.setDate(d.getDate()+((4-d.getDay()+7)%7||7));
 for(let i=0;i<5;i++){a.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+7)}return a}
function demoChain(){const spot=24800+Math.round(Math.random()*20),oc={},step=50,base=Math.round(spot/step)*step;
 for(let k=base-1000;k<=base+1000;k+=step){const dist=Math.abs(k-spot),tv=Math.max(5,120-dist*.12),
  ce=Math.max(0,spot-k)+tv,pe=Math.max(0,k-spot)+tv,w=Math.exp(-dist/400),rnd=()=>.8+Math.random()*.4;
  const mk=(t,l)=>({security_id:k*10+t,last_price:+(l*rnd()).toFixed(2),oi:Math.round(2e6*w*rnd()),previous_oi:Math.round(1.9e6*w),implied_volatility:+(12+dist/100).toFixed(1)});
  oc[k+'.000000']={ce:mk(1,ce),pe:mk(2,pe)}}
 return{data:{last_price:spot,oc}}}

/* ---------- option chain ---------- */
let chain=null;
async function loadExpiries(){
 const u=und();
 const list=DEMO?demoExpiries():(await post('/optionchain/expirylist',{UnderlyingScrip:u.id,UnderlyingSeg:u.seg})).data;
 $('exp').innerHTML=list.map(e=>`<option>${e}</option>`).join('');loadChain();
}
async function loadChain(){
 try{
  const u=und(),e=$('exp').value;
  const j=DEMO?demoChain():await post('/optionchain',{UnderlyingScrip:u.id,UnderlyingSeg:u.seg,Expiry:e});
  chain=j.data;renderChain();$('dot').className='on';
  $('st').innerHTML=(DEMO?'<b>DEMO (simulated)</b> · ':'')+`${u.name} ${e} · updated ${new Date().toLocaleTimeString()} · tap an LTP to open its chart + OI profile`;
 }catch(err){$('st').textContent='Error: '+err.message;$('dot').className=''}
}
function renderChain(){
 const spot=chain.last_price,ks=Object.keys(chain.oc).map(Number).sort((a,b)=>a-b);
 const atm=ks.reduce((a,b)=>Math.abs(b-spot)<Math.abs(a-spot)?b:a),i=ks.indexOf(atm),w=+$('win').value;
 const rows=ks.slice(Math.max(0,i-w),i+w+1),get=k=>chain.oc[k.toFixed(6)]||chain.oc[k+'.000000']||{};
 let mx=1;rows.forEach(k=>{const o=get(k);mx=Math.max(mx,o.ce?.oi||0,o.pe?.oi||0)});
 $('spot').textContent='Spot '+spot;
 $('tb').innerHTML=rows.map(k=>{
  const o=get(k),c=o.ce||{},p=o.pe||{},cd=(c.oi||0)-(c.previous_oi||0),pd=(p.oi||0)-(p.previous_oi||0);
  const cell=(x,cls)=>`<td class="${cls}"><span>${x}</span></td>`;
  const bar=(x,cls)=>`<td class="${cls}"><i class="bo" style="width:${Math.min(100,(x||0)/mx*100)}%"></i><span>${fmt(x)}</span></td>`;
  const dd=d=>`<td class="${d>=0?'up':'dn'}"><span>${d>=0?'+':''}${fmt(d)}</span></td>`;
  const tap=(x,t)=>x.security_id?`<td class="t" onclick="openChart(${x.security_id},'${k} ${t}',${x.last_price||0})"><span>${(x.last_price??0).toFixed(2)}</span></td>`:'<td>-</td>';
  const iv=x=>x.implied_volatility!=null?(+x.implied_volatility).toFixed(1):'-';
  return `<tr class="${k===atm?'atm':''} ${k<spot?'ic':''} ${k>spot?'ip':''}">${bar(c.oi,'ce')}${dd(cd)}${cell(iv(c),'ce')}${tap(c,'CE')}<td class="k">${k}</td>${tap(p,'PE')}${cell(iv(p),'pe')}${dd(pd)}${bar(p.oi,'pe')}</tr>`}).join('');
}
$('und').onchange=loadExpiries;$('exp').onchange=loadChain;$('win').onchange=()=>chain&&renderChain();
setInterval(()=>{if($('cv').style.display!=='flex')loadChain()},5000);   // Dhan chain limit ≈ 1 req / 3 s

/* ---------- chart + OI profile ---------- */
let chart,candles,bars=[],oi=[],prof=null,ctimer=null,cur=null,first=true,dsim=null;
function initChart(){
 chart=LightweightCharts.createChart($('chart'),{layout:{background:{color:'#0e1116'},textColor:'#d7dde6'},
  grid:{vertLines:{color:'#1a1f27'},horzLines:{color:'#1a1f27'}},timeScale:{timeVisible:true,rightOffset:12},rightPriceScale:{borderColor:'#2a313c'},autoSize:true});
 candles=chart.addCandlestickSeries({upColor:'#26a69a',downColor:'#ef5350',wickUpColor:'#26a69a',wickDownColor:'#ef5350',borderVisible:false});
 draw();
}
function openChart(sid,title,ltp){
 cur={sid,ltp};$('ctitle').textContent=und().name+' '+$('exp').value+' '+title;$('cv').style.display='flex';
 if(!chart)initChart();bars=[];oi=[];prof=null;dsim=null;first=true;candles.setData([]);
 clearInterval(ctimer);cRefresh();ctimer=setInterval(cRefresh,5000);
}
function closeChart(){clearInterval(ctimer);$('cv').style.display='none';loadChain()}
['intv','mode','tick'].forEach(id=>$(id).onchange=()=>{if(id==='intv')first=true;cRefresh()});
const ist=()=>new Date().toLocaleString('sv',{timeZone:'Asia/Kolkata'});
const fixTs=t=>(t<1.2e9?t+315513000:t)+19800;
function demoStep(){
 const step=300,now=Math.floor(Date.now()/1000/step)*step+19800;
 if(!dsim){dsim={b:[],o:[]};let p=cur.ltp||100,o=800000;
  for(let i=70;i>0;i--){const op=p;p=Math.max(1,p+(Math.random()-.5)*p*.03);
   dsim.b.push({time:now-i*step,open:op,high:Math.max(op,p)*1.005,low:Math.min(op,p)*.995,close:p});o+=Math.round((Math.random()-.4)*30000);dsim.o.push(o)}}
 const b=dsim.b,l=b.at(-1);if(l.time<now){b.push({time:now,open:l.close,high:l.close,low:l.close,close:l.close});dsim.o.push(dsim.o.at(-1))}
 const c=b.at(-1);c.close=Math.max(1,c.close*(1+(Math.random()-.5)*.01));c.high=Math.max(c.high,c.close);c.low=Math.min(c.low,c.close);dsim.o[dsim.o.length-1]+=Math.round((Math.random()-.35)*5000);
 bars=b.map(x=>({...x}));oi=dsim.o.slice();
}
async function cRefresh(){
 try{
  if(DEMO)demoStep();else{
   const j=await post('/charts/intraday',{securityId:String(cur.sid),exchangeSegment:und().fno,instrument:'OPTIDX',interval:$('intv').value,oi:true,fromDate:ist().slice(0,10)+' 09:15:00',toDate:ist()});
   bars=[];oi=[];(j.close||[]).forEach((c,i)=>{bars.push({time:fixTs(j.timestamp[i]),open:j.open[i],high:j.high[i],low:j.low[i],close:c});oi.push(j.open_interest?j.open_interest[i]:0)});
  }
  if(!bars.length){$('st2').textContent='No data returned';return}
  candles.setData(bars);if(first){chart.timeScale().fitContent();first=false}
  const tick=+$('tick').value,mode=$('mode').value,m=new Map();
  bars.forEach((b,i)=>{const k=(Math.round(b.close/tick)*tick).toFixed(2);mode==='raw'?m.set(k,oi[i]):m.set(k,(m.get(k)||0)+(i?oi[i]-oi[i-1]:0))});
  let max=0,poc=null;m.forEach((v,k)=>{if(v>max){max=v;poc=k}});prof={m,max,poc,tick};
  const l=bars.at(-1);$('st2').innerHTML=`LTP <b>${l.close.toFixed(2)}</b> · OI <b>${fmt(oi.at(-1))}</b> · OI-POC <b>₹${poc??'-'}</b> · ${new Date().toLocaleTimeString()}`;
 }catch(e){$('st2').textContent='Error: '+e.message}
}
const cv=$('ov'),cx=cv.getContext('2d');
function draw(){
 const w=$('wrap'),dpr=devicePixelRatio||1,W=w.clientWidth,H=w.clientHeight;
 if(cv.width!==W*dpr||cv.height!==H*dpr){cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px'}
 cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,W,H);cx.font='11px system-ui';
 if(prof&&prof.max>0){const x0=W-chart.priceScale('right').width(),maxW=W*.35;
  prof.m.forEach((v,k)=>{if(v<=0)return;const p=+k,y1=candles.priceToCoordinate(p+prof.tick/2),y2=candles.priceToCoordinate(p-prof.tick/2);if(y1==null||y2==null)return;
   const r=v/prof.max,len=maxW*r,poc=k===prof.poc,y=(y1+y2)/2;
   cx.fillStyle=poc?'rgba(245,166,35,.85)':r>=.7?'rgba(38,166,154,.65)':r<=.2?'rgba(239,83,80,.35)':'rgba(125,135,149,.4)';
   cx.fillRect(x0-len,y1,len,Math.max(1,y2-y1-1));
   if(poc){cx.strokeStyle='#f5a623';cx.setLineDash([4,3]);cx.beginPath();cx.moveTo(0,y);cx.lineTo(x0,y);cx.stroke();cx.setLineDash([]);cx.fillStyle='#f5a623';cx.fillText('OI-POC '+k,6,y-4)}
   else if(r>=.7){cx.fillStyle='#26a69a';cx.fillText('HOIN',x0-len-34,y+3)}})}
 requestAnimationFrame(draw);
}
loadExpiries().catch(e=>$('st').textContent='Error: '+e.message);
</script></body></html>
